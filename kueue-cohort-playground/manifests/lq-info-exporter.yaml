# LQ Info Exporter
#
# Production-viable prototype for the missing kueue_local_queue_info
# join metric. Reads LocalQueue specs from the K8s API and exposes
# the LQ→CQ mapping as a Prometheus metric.
#
# This replaces the hard-coded recording rules in Group 1 of
# recording-rules.yaml with a dynamic discovery mechanism.

---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lq-info-exporter
  namespace: kueue-system

---
# ClusterRole: read-only access to LocalQueues
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lq-info-exporter
rules:
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["localqueues"]
    verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lq-info-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lq-info-exporter
subjects:
  - kind: ServiceAccount
    name: lq-info-exporter
    namespace: kueue-system

---
# ConfigMap: exporter script
apiVersion: v1
kind: ConfigMap
metadata:
  name: lq-info-exporter-scripts
  namespace: kueue-system
data:
  exporter.py: |
    #!/usr/bin/env python3
    """Minimal Prometheus exporter for LocalQueue-to-ClusterQueue mapping.

    Uses the K8s API directly via service account token (no kubectl needed).
    """
    import json
    import os
    import ssl
    import threading
    import time
    import urllib.request
    from http.server import HTTPServer, BaseHTTPRequestHandler

    SA_TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    SA_CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    API_HOST = os.environ.get("KUBERNETES_SERVICE_HOST", "kubernetes.default.svc")
    API_PORT = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
    LQ_API = "apis/kueue.x-k8s.io/v1beta2/localqueues"

    METRICS_TEXT = ""

    def k8s_get(path):
        with open(SA_TOKEN_PATH) as f:
            token = f.read().strip()
        url = f"https://{API_HOST}:{API_PORT}/{path}"
        req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
        ctx = ssl.create_default_context(cafile=SA_CA_PATH)
        with urllib.request.urlopen(req, context=ctx, timeout=30) as resp:
            return json.loads(resp.read())

    def update_metrics():
        global METRICS_TEXT
        while True:
            try:
                data = k8s_get(LQ_API)
                lines = [
                    "# HELP kueue_local_queue_info LocalQueue to ClusterQueue mapping",
                    "# TYPE kueue_local_queue_info gauge",
                ]
                for item in data.get("items", []):
                    name = item["metadata"]["name"]
                    ns = item["metadata"]["namespace"]
                    cq = item["spec"].get("clusterQueue", "")
                    if cq:
                        lines.append(
                            f'kueue_local_queue_info{{name="{name}",'
                            f'namespace="{ns}",'
                            f'cluster_queue="{cq}"}} 1'
                        )
                METRICS_TEXT = "\n".join(lines) + "\n"
            except Exception as e:
                print(f"Error updating metrics: {e}", flush=True)
            time.sleep(30)

    class MetricsHandler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/metrics":
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; charset=utf-8")
                self.end_headers()
                self.wfile.write(METRICS_TEXT.encode())
            elif self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
            else:
                self.send_response(404)
                self.end_headers()

        def log_message(self, format, *args):
            pass

    if __name__ == "__main__":
        t = threading.Thread(target=update_metrics, daemon=True)
        t.start()
        time.sleep(2)
        server = HTTPServer(("", 9091), MetricsHandler)
        print("LQ info exporter serving on :9091/metrics", flush=True)
        server.serve_forever()

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lq-info-exporter
  namespace: kueue-system
  labels:
    app: lq-info-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lq-info-exporter
  template:
    metadata:
      labels:
        app: lq-info-exporter
    spec:
      serviceAccountName: lq-info-exporter
      containers:
        - name: exporter
          image: python:3-alpine
          command: ["python3", "/scripts/exporter.py"]
          ports:
            - name: metrics
              containerPort: 9091
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: lq-info-exporter-scripts
            defaultMode: 0755

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: lq-info-exporter
  namespace: kueue-system
  labels:
    app: lq-info-exporter
spec:
  selector:
    app: lq-info-exporter
  ports:
    - name: metrics
      port: 9091
      targetPort: metrics
      protocol: TCP

---
# ServiceMonitor for Prometheus discovery
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lq-info-exporter
  namespace: kueue-system
  labels:
    app: lq-info-exporter
spec:
  selector:
    matchLabels:
      app: lq-info-exporter
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      honorLabels: true
